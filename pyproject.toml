[project]
name = "tokenfold"
version = "0.1.0"
description = "tokenfold — a TypeSafe-style typed decision API (choice / score / noul) scored by candidate logprobs on an open-weights model, with per-type temperature calibration."
readme = "README.md"
authors = [{ name = "Blake Bauman", email = "blake.bauman@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "scipy>=1.16",
    "requests>=2.32",
]

[project.scripts]
tokenfold-server = "tokenfold.server:main"
tokenfold-evaluate = "tokenfold.evaluate:main"
tokenfold-build-eval = "tokenfold.tasks.build:main"

[project.optional-dependencies]
llama = [
    "huggingface-hub>=0.35",
    "llama-cpp-python>=0.3.35",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "ty>=0.0.79",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenfold"]

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E731", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "RUF012"]

# Coverage is measured by `make test-cov`; kept out of pytest addopts so a single-test run stays fast.
[tool.coverage.run]
source = ["src/tokenfold"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60

[tool.ty.environment]
python-version = "3.14"
